<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flexbox Layout Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }

    .main-container {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .card {
      background-color: #fff;
      padding: 16px;
      border-radius: 6px;
      width: 300px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .items-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
    }

    .item {
      width: 48%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .item img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
    }

    .item span {
      margin-top: 6px;
      font-size: 14px;
    }

    .card a {
      margin-top: 10px;
      font-size: 14px;
      color: #007185;
      text-decoration: none;
      align-self: flex-start;
    }

    .card a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Left Card -->
    <div class="card">
      <h3>Revamp your home in style</h3>
      <div class="items-grid">
        <div class="item">
          <img src="" alt="Item 1">
          <span>Cushion covers, bedsheets & more</span>
        </div>
        <div class="item">
          <img src="" alt="Item 2">
          <span>Figurines, vases & more</span>
        </div>
        <div class="item">
          <img src="" alt="Item 3">
          <span>Home storage</span>
        </div>
        <div class="item">
          <img src="" alt="Item 4">
          <span>Lighting solutions</span>
        </div>
      </div>
      <a href="#">Explore all</a>
    </div>

    <!-- Right Card -->
    <div class="card">
      <h3>Starting ₹149 | Headphones</h3>
      <div class="items-grid">
        <div class="item">
          <img src="" alt="boAt">
          <span>Starting ₹349 | boAt</span>
        </div>
        <div class="item">
          <img src="" alt="BOULT">
          <span>Starting ₹149 | boult</span>
        </div>
        <div class="item">
          <img src="" alt="NOISE">
          <span>Starting ₹649 | Noise</span>
        </div>
        <div class="item">
          <img src="" alt="ZEBRONICS">
          <span>Starting ₹149 | Zebronics</span>
        </div>
      </div>
      <a href="#">See all offers</a>
    </div>
  </div>

</body>
</html>
