<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
      div#box{
        width: 90%;
        height: 50vh;
        border: 2px solid black;
        margin: auto;
        display: flex;
        justify-content: space-evenly;
        align-items: end;
      }

      div#box>div{
        width: 30px;
        border: 2px solid black;
      }

      div#box>div:nth-of-type(1){
        height: 80%;
        background-color: #5fd1c8;
      }
      div#box>div:nth-of-type(2){
        height: 50%;
        background-color: #ff7f7e;
      }
      div#box>div:nth-of-type(3){
        height: 30%;
        background-color: #9ff570;
      }
      div#box>div:nth-of-type(4){
        height: 70%;
        background-color:  #b272f5;
      }
      div#box>div:nth-of-type(5){
        height: 60%;
        background-color:  #e8e40a;
      }
      
      </style>

<body>
    <div id="box">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
 
</body>

</html>
