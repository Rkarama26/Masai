<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>

<body>
    <div id="root">Hello form dom</div>
</body>

</html>
<script type="text/babel">
    const { useState } = React;

    function GetData() {
        const [data, setdata] = useState([]); // intial value

        async function fetchData() {
            try {
                const res = await fetch(`https://jsonplaceholder.typicode.com/posts`)
                const result = await res.json();
                console.log(result)
                setdata(result)


            } catch (error) {
                console.error(error)
            }
        }

        return (
            <>
                <button onClick={fetchData}>
                    fetchData
                </button>
                <ul>
                    {data.map((item, index) => (
                        <li key={index}>
                            <h2> Title: {item.title}</h2>
                            <p> Content: {item.body}</p>
                        </li>
                    ))}
                </ul>
            </>
        )
    }

    function PostData() {
        const [movies, setMovies] = useState([]);
        const [movieName, setMovieName] = useState("");

        // Fetch movies from Firebase
        async function fetchReq() {
            try {
                const res = await fetch(
                    "https://movie-ae558-default-rtdb.asia-southeast1.firebasedatabase.app/movies.json"
                );
                const result = await res.json();

                if (!result) {
                    setMovies([]);
                    return;
                }

                const movieArray = Object.entries(result).map(([id, movie]) => ({
                    id,
                    ...movie,
                }));

                setMovies(movieArray);
            } catch (error) {
                console.error("Error fetching movies:", error);
            }
        }

        // Add a new movie
        async function addMovie() {
            if (!movieName) return alert("Please enter a movie name");

            try {
                await fetch(
                    "https://movie-ae558-default-rtdb.asia-southeast1.firebasedatabase.app/movies.json",
                    {
                        method: "POST",
                        body: JSON.stringify({ title: movieName }),
                        headers: { "Content-Type": "application/json" },
                    }
                );

                setMovieName(""); // clear input
                fetchReq(); // refresh list
            } catch (error) {
                console.error("Error adding movie:", error);
            }
        }

        return (
            <>
                <h1>Post Request</h1>
                <input
                    type="text"
                    placeholder="Enter movie name"
                    value={movieName}
                    onChange={(e) => setMovieName(e.target.value)}
                />
                <button onClick={addMovie}>Add Movie</button>
                <button onClick={fetchReq}>Fetch Movies</button>

                <ul>
                    {movies.map((item) => (
                        <li key={item.id}>{item.title}</li>
                    ))}
                </ul>
            </>
        );
    }




    function App() {
        return (
            <>
                <GetData />
                <PostData />
            </>
        )
    }

    let root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />)
</script>
