<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile Card</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React and ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div id="root"></div>

  <script type="text/babel">

    function ProfileCard({
      name = "Anonymous User",
      age = 18,
      bio = "This user has not provided a biography yet."
    }) {
      // Truncate bio to 100 characters
      const truncatedBio = bio.length > 100 
        ? bio.substring(0, 100) + "… Read More" 
        : bio;

      return (
        <div className="max-w-sm w-full bg-white shadow-lg rounded-2xl p-6 text-center">
          <h2 className="text-2xl font-bold text-gray-800 mb-2">{name}</h2>
          <p className="text-gray-600 mb-4">Age: {age}</p>
          <p className="text-gray-700">{truncatedBio}</p>
        </div>
      );
    }

    function App() {
      return (
        <div className="space-y-6">
          <ProfileCard 
            name="Rohit Vishwakarma" 
            age={23} 
            bio="I am a passionate software engineer who enjoys building full-stack applications, exploring new technologies, and working on innovative projects that make life easier for people."
          />

          <ProfileCard 
            age={30} 
            bio="This bio is short."
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
