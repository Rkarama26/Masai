<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <div id="root">Hello form dom</div>
</body>

</html>
<script type="text/babel">
    const { useState } = React;

    function ToggleButton() {
        const [state, setState] = useState(false);

        return (
            <div className="flex flex-col items-center space-y-4 mt-6">
                <h1 className={`text-xl font-bold ${state ? "text-green-600" : "text-red-500"} `}>
                    Current State: {state ? "ON ✅" : "OFF ❌"}
                </h1>

                <button
                    onClick={() => setState(!state)}
                    className={` 
          px-6 py-3 rounded-full font-semibold shadow-md transition-all duration-300
          ${state
                            ? "bg-green-500 text-white hover:bg-green-600"
                            : "bg-gray-300 text-black hover:bg-red-400"
                        }
        `}
                >
                    {state ? "Turn OFF" : "Turn ON"}
                </button>
            </div>
        );
    }



    function App() {
        return (
            <>
                <ToggleButton />
            </>
        )
    }

    let root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />)
</script>
