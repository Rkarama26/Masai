<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo with Priority</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .high {
            color: red;
            font-weight: bold;
        }

        .medium {
            color: orange;
        }

        .low {
            color: green;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>

<body>
    <div id="root"></div>
</body>
<script type="text/babel">

    const { useState } = React;

    function TodoList() {
        const [tasks, setTasks] = useState([]);
        const [input, setInput] = useState('');
        const [priority, setPriority] = useState('Medium');
        const [priorityFilter, setPriorityFilter] = useState('All');
        const [statusFilter, setStatusFilter] = useState('All');

        // simply check if input is not empty add it to tasklist
        const addTask = () => {
            if (input.trim() === "") return alert("Please enter a task title");
            const newTask = { text: input, completed: false, priority };
            const updatedTasks = [...tasks, newTask];
            setTasks(sortByPriority(updatedTasks));
            setInput('');
            setPriority('Medium');
        };
        // sort task by priority
        const sortByPriority = (tasks) => {
            const priorityOrder = { High: 1, Medium: 2, Low: 3 };
            return tasks.slice().sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);
        };
        // undo task
        const toggleComplete = (index) => {
            const newTasks = [...tasks];
            newTasks[index].completed = !newTasks[index].completed;
            setTasks(newTasks);
        };
        // delete task
        const deleteTask = (index) => {
            const newTasks = tasks.filter((_, i) => i !== index);
            setTasks(newTasks);
        };

        // filter task by priority , complete
        const filteredTasks = tasks.filter(task => {
            const priorityMatch = priorityFilter === "All" || task.priority === priorityFilter;
            const statusMatch =
                statusFilter === "All" ||
                (statusFilter === "Completed" && task.completed) ||
                (statusFilter === "Incomplete" && !task.completed);
            return priorityMatch && statusMatch;
        });

        return (
            <div>
                <h2>Priority Todo List</h2>

                <input
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                    placeholder="Task title"
                />
                <select value={priority} onChange={(e) => setPriority(e.target.value)}>
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>
                <button onClick={addTask}>Add Task</button>

                <div style={{ marginTop: "15px" }}>
                    <label>Priority Filter: </label>
                    <select value={priorityFilter} onChange={(e) => setPriorityFilter(e.target.value)}>
                        <option>All</option>
                        <option>High</option>
                        <option>Medium</option>
                        <option>Low</option>
                    </select>

                    <label style={{ marginLeft: "10px" }}>Status Filter: </label>
                    <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
                        <option>All</option>
                        <option>Completed</option>
                        <option>Incomplete</option>
                    </select>
                </div>

                <ul>
                    {filteredTasks.map((task, i) => (
                        <li key={i}>
                            <span
                                onClick={() => toggleComplete(i)}
                                className={`${task.priority.toLowerCase()} ${task.completed ? "completed" : ""}`}
                                style={{ cursor: "pointer" }}
                            >
                                {task.text} ({task.priority})
                            </span>
                            <button onClick={() => deleteTask(i)}>Delete</button>
                        </li>
                    ))}
                </ul>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<TodoList />);

</script>

</html>
