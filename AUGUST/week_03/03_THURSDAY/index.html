    // useState can hold multiple values
    function UserProfile() {
        const { useState } = React;

        const [user, setUser] = useState({ name: "John Doe", age: 79 });
        function updateAge() {
            setUser({ ...user, age: user.age + 1 })
        }


        return (
            <>
                <h1>{user.name} is {user.age} old</h1>
                <button onClick={updateAge}>increase</button>

            </>
        )
    }

    
    function App2() {
        return (
            <>
                <h1>React App2</h1>
                <UserProfile />
            </>
        )
    }


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App2 />);

</script>
