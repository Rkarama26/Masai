<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        button {
            margin: 5px;
            padding: 8px 12px;
            font-size: 16px;
        }

        .counter {
            font-size: 14px;
            color: gray;
        }
    </style>
</head>

<body>

    <div>
        <button onclick="changeTitle()">Change Title</button>
        <p id="domCounts"></p>
    </div>
</body>
<script>
    let count = 0;
    function changeTitle() {
        document.title = `javaScript Dom ${count + 1}`;
        count++;
        document.getElementById("domCounts").textContent = `Vanilla Dom Updates: ${count}`
    }


</script>

</html>
