<!DOCTYPE html>
<html>
<head>
  <title>User Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>User Dashboard</h2>
  <div id="productList"></div>

  <script src="middleware.js"></script>
  <script>
    async function fetchProducts() {
      const res = await fetch("https://auth-d2bdd-default-rtdb.firebaseio.com/products.json");
      const data = await res.json();

      let html = "";
      for (let id in data) {
        const p = data[id];
        html += `
          <div class="card">
            <img src="${p.image}" />
            <h3>${p.title}</h3>
            <p>₹${p.price}</p>
          </div>
        `;
      }
      document.getElementById("productList").innerHTML = html;
    }

    fetchProducts();
  </script>
</body>
</html>
