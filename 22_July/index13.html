<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Div</title>
  <style>
    #target-div {
      width: 300px;
      height: 150px;
      border: 2px solid black;
      padding: 20px;
      margin-top: 20px;
      background-color: lightgray;
    }

    input, button {
      margin: 5px;
    }
  </style>
</head>
<body>

  <!-- Input for color name -->
  <label for="colorInput">Enter Color Name:</label>
  <input type="text" id="colorInput" placeholder="e.g., red, blue, green"><br>

  <!-- Input for text content -->
  <label for="textInput">Enter Text Content:</label>
  <input type="text" id="textInput" placeholder="New content"><br>

  <!-- Buttons -->
  <button id="changeColorBtn">Change Background</button>
  <button id="updateTextBtn">Update Text</button>

  <!-- Target div -->
  <div id="target-div">This is the initial content of the div.</div>

  <script>
    // Select  elements
    const colorInput = document.getElementById('colorInput');
    const textInput = document.getElementById('textInput');
    const changeColorBtn = document.getElementById('changeColorBtn');
    const updateTextBtn = document.getElementById('updateTextBtn');
    const targetDiv = document.getElementById('target-div');

    // Function to check if a color name is valid
    function isValidColor(color) {
      const temp = document.createElement('div');
      temp.style.color = color;
      return temp.style.color !== '';
    }

    // Event listener for Change Background button
    changeColorBtn.addEventListener('click', function () {
      const colorValue = colorInput.value.trim().toLowerCase();

      if (isValidColor(colorValue)) {
        targetDiv.style.backgroundColor = colorValue;
      } else {
        alert('Invalid color name!');
      }
    });

    // Event listener for Update Text button
    updateTextBtn.addEventListener('click', function () {
      const textValue = textInput.value.trim();

      if (textValue === '') {
        alert('Please enter some text!');
      } else {
        targetDiv.textContent = textValue;
      }
    });
  </script>

</body>
</html>
