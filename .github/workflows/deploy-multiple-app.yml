name: Deploy Dashboard App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd AUGUST/week_04/02_WEDNESDAY/dashboard
          npm install

      - name: Build app
        run: |
          cd AUGUST/week_04/02_WEDNESDAY/dashboard
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: AUGUST/week_04/02_WEDNESDAY/dashboard/dist
          destination_dir: dashboard
