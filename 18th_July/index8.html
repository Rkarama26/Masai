<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div#container {
        padding: 30px;
        width: 30%;
        height: 80vh;
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: repeat(5, 1fr);
    }

    div#container>div {
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        margin: 20px;
        border-radius: 5px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bolder;
    }

    div#container div:first-child {
        grid-column: span 4;
        padding: 20px;
    }
.operator {
    background-color: black;
    color: white;
    font-weight: bolder;
}

.operator:hover {
    background-color: white;
    color: black;
}


    #clear {
        background-color: red;

    }
    #clear:hover{
        background-color: white;
        columns: black;
    }
    .nums:hover{
        background-color: black;
        color: white;
    }
</style>

<body>
    <div id="container">

        <div></div>
        <div class="nums">1</div>
        <div class="nums">2</div>
        <div class="nums">3</div>
        <div id="addition" class="operator">+</div>
        <div class="nums">4</div>
        <div class="nums">5</div>
        <div class="nums">6</div>
        <div id="substraction" class="operator">-</div>
        <div class="nums">7</div>
        <div class="nums">8</div>
        <div class="nums">9</div>
        <div id="multiplication" class="operator">*</div>
        <div id="clear" >C</div>
        <div class="nums">0</div>
        <div id="equal" class="operator">=</div>
        <div id="division" class="operator">/</div>
    </div>
</body>

</html>
