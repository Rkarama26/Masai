<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div#container {
        padding: 30px;
        width: 90%;
        height: 60vh;
        margin: auto;
        background-color: #292a2c;
        display: grid;
        gap: 2px;
        grid-template-columns: repeat(12, 1fr);
        grid-auto-rows: repeat(5, 1fr);
        border-radius: 20px;
    }

    div#container>div {
        background-color: #2d3538;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #4ab1d2;
        margin: 7px;
        border-radius: 10px;

    }

    #enter,
    #shift {
        grid-column: span 2;
    }

    #space {
        grid-column: span 4;
    }
</style>

<body>
    <div id="container">

        <div>~</div>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div>0</div>
        <div>Delete</div>
        <div>tab</div>
        <div>Q</div>
        <div>R</div>
        <div>S</div>
        <div>T</div>
        <div>Y</div>
        <div>6</div>
        <div>U</div>
        <div>I</div>
        <div>O</div>
        <div>P</div>
        <div>\</div>
        <div>caps</div>
        <div>A</div>
        <div>S</div>
        <div>D</div>
        <div>F</div>
        <div>G</div>
        <div>H</div>
        <div>J</div>
        <div>K</div>
        <div>L</div>

        <div id="enter">enter</div>
        <div>shift</div>
        <div>Z</div>
        <div>X</div>
        <div>C</div>
        <div>V</div>
        <div>B</div>
        <div>N</div>
        <div>M</div>
        <div>&lt;</div>
        <div>&gt;</div>
        <div id="shift">shift</div>
        <div>0</div>
        <div>control</div>
        <div>options</div>
        <div>alt</div>
        <div id="space">space</div>
        <div>alt</div>
        <div>options</div>
        <div>&lt;</div>
        <div>&gt;</div>
       


    </div>
</body>

</html>
