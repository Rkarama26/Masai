<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      display: flex;
      justify-content: center;
      padding: 2rem;
    }

    .form-container {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      margin-top: 1rem;
      font-size: 1rem;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .message {
      margin-top: 1rem;
      padding: 0.8rem;
      text-align: center;
      border-radius: 4px;
      display: none;
    }

    .success {
      background-color: #d4edda;
      color: #155724;
    }

    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Register</h2>
    <form id="registerForm">
      <input type="text" id="name" placeholder="Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Register</button>
    </form>
    <div id="message" class="message"></div>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const messageDiv = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      console.log("Form Submitted:");
      console.log("Name:", name);
      console.log("Email:", email);
      console.log("Password:", password);

      //  validation
      if (!name || !email || !password) {
        showMessage("Please fill all fields.", "error");
        console.warn("Validation failed: Some fields are empty.");
        return;
      }

      const student = {
        name,
        email,
        course: "course 1",
        age: Math.floor(Math.random() * 30) + 18
      };

      console.log("POST data being sent:", student);

      try {
        const res = await fetch("https://6887c05a071f195ca981ddf3.mockapi.io/students", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(student)
        });

        console.log("Raw response:", res);

        if (!res.ok) throw new Error("Failed to register user.");

        const data = await res.json();
        console.log("API response data:", data);

        showMessage(`Registered successfully! ID: ${data.id}`, "success");
        form.reset();
      } catch (err) {
        console.error("Error during registration:", err);
        showMessage("Registration failed. Email may already exist.", "error");
      }
    });

    function showMessage(msg, type) {
      messageDiv.textContent = msg;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = "block";
    }
  </script>
</body>
</html>
