    div#container {
        width: 90%;
        display: grid;
        margin: auto;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: repeat(3, 1fr);
        justify-content: center;
        gap: 10px;

    }

    div#container>div {
        border: 2px solid;
        text-align: center;
        min-width: 200px;
        

    }

    div#container>div img:first-child {
        width: 100%;
    }

    div#container>div img:last-child {
        margin-top: -10px;
        width: 50%;
    }
</style>
