<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4x2 Grid</title>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 150px);
      gap: 10px;
      padding: 20px;
    }

    .grid-item {
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
    }

    .item1 { background-color: #ff6b6b; }
    .item2 { background-color: #6bc5ff; }
    .item3 { background-color: #51d88a; }
    .item4 { background-color: #ffd93d; color: black; }
    .item5 { background-color: #9d4edd; }
    .item6 { background-color: #ff922b; }
    .item7 { background-color: #3bc9db; }
    .item8 { background-color: #adb5bd; color: black; }
  </style>
</head>
<body>

  <div class="grid-container">
    <div class="grid-item item1">1</div>
    <div class="grid-item item2">2</div>
    <div class="grid-item item3">3</div>
    <div class="grid-item item4">4</div>
    <div class="grid-item item5">5</div>
    <div class="grid-item item6">6</div>
    <div class="grid-item item7">7</div>
    <div class="grid-item item8">8</div>
  </div>

</body>
</html>
