<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Full Screen Grid</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    .grid-container {
      width: 100%;
      height: 100vh; 
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr); 
      gap: 10px;
      padding: 10px;
      box-sizing: border-box;
    }

    .grid-item {
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
    }

    .item1 {
      background-color: #ff6b6b;
      grid-column: span 2;
    }

    .item2 {
      background-color: #6bc5ff;
      grid-row: span 2;
    }

    .item3 {
      background-color: #51d88a;
    }

    .item4 {
      background-color: #ffd93d;
      color: black;
    }
  </style>
</head>

<body>
  <div class="grid-container">
    <div class="grid-item item1">4</div>
    <div class="grid-item item2">6</div>
    <div class="grid-item item3">5</div>
    <div class="grid-item item4">1</div>
  </div>
</body>

</html>
