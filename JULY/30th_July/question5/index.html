<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Novels Library</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }
    input, select {
      margin: 5px;
      padding: 5px;
    }
    .novel {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Novels Library</h2>

  <input type="text" id="searchInput" placeholder="Search by title or author">
  
  <br>

  <label>Filter Year:</label>
  <select id="filterYear">
    <option value="">All</option>
    <option value="2020">2020</option>
    <option value="2021">2021</option>
    <option value="2022">2022</option>
    <option value="2023">2023</option>
  </select>

  <label>or Range:</label>
  <input type="number" id="startYear" placeholder="Start Year">
  <input type="number" id="endYear" placeholder="End Year">

  <br>

  <label>Sort By Price:</label>
  <select id="sortPrice">
    <option value="">None</option>
    <option value="asc">Low to High</option>
    <option value="desc">High to Low</option>
  </select>

  <br>

  <div id="novelList"></div>

  <script>
    const url = "https://novels-ed001-default-rtdb.asia-southeast1.firebasedatabase.app/novels.json";
    let novels = [];

    async function fetchData() {
      const res = await fetch(url);
      const data = await res.json();
      novels = Object.values(data); // Convert object to array
      displayNovels(novels);
    }

    function displayNovels(data) {
      const container = document.getElementById("novelList");
      container.innerHTML = "";
      if (data.length === 0) {
        container.innerHTML = "<p>No novels found.</p>";
        return;
      }
      data.forEach(novel => {
        container.innerHTML += `
          <div class="novel">
            <h3>${novel.title}</h3>
            <p><strong>Author:</strong> ${novel.author}</p>
            <p><strong>Genre:</strong> ${novel.genre}</p>
            <p><strong>Year:</strong> ${novel.release_year}</p>
            <p><strong>Price:</strong> ₹${novel.price}</p>
          </div>
        `;
      });
    }

    function applyFilters() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const filterYear = document.getElementById("filterYear").value;
      const startYear = parseInt(document.getElementById("startYear").value);
      const endYear = parseInt(document.getElementById("endYear").value);
      const sortOption = document.getElementById("sortPrice").value;

      let filtered = novels.filter(novel => {
        const matchSearch = novel.title.toLowerCase().includes(search) || novel.author.toLowerCase().includes(search);

        let matchYear = true;
        if (filterYear) {
          matchYear = novel.release_year == filterYear;
        } else if (!isNaN(startYear) && !isNaN(endYear)) {
          matchYear = novel.release_year >= startYear && novel.release_year <= endYear;
        }

        return matchSearch && matchYear;
      });

      if (sortOption === "asc") {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sortOption === "desc") {
        filtered.sort((a, b) => b.price - a.price);
      }

      displayNovels(filtered);
    }

    // Event listeners
    document.getElementById("searchInput").addEventListener("input", applyFilters);
    document.getElementById("filterYear").addEventListener("change", applyFilters);
    document.getElementById("startYear").addEventListener("input", applyFilters);
    document.getElementById("endYear").addEventListener("input", applyFilters);
    document.getElementById("sortPrice").addEventListener("change", applyFilters);

    fetchData();
  </script>
</body>
</html>
