<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Management System</title>
</head>

<style>
    body {
        padding: 0px;
        margin: 0px;
        font-family: Arial, Helvetica, sans-serif;
        height: calc(100vh + 20vh);

    }

    #container {
        display: flex;
        justify-content: space-evenly;
        position: relative;
        margin: auto;
    }

    .subcontainer {
        width: 45%;
        margin: 10px;
        padding: 10px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.19), 0 6px 6px rgba(0, 0, 0, 0.23);
        background-color: #f9f9f9;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background-color: #909c90;
        color: white;
        padding: 8px;
        text-align: center;
    }

    td {
        border: 1px solid;
        padding: 8px;
        text-align: center;
    }

    #entryContainer {
        display: flex;
        gap: 30px;
        padding: 20px;
        justify-content: space-evenly;
        flex-wrap: wrap;
        background-color: #f9f9f9;
    }

    #entryContainer>div {
        background-color: #fff;
        padding: 20px 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 300px;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    input[type="text"] {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }

    input[type="number"] {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }

    button[type="submit"] {
        padding: 10px;
        background-color: #4CAF50;
        color: white;
        border: none;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    button[type="submit"]:hover {
        background-color: #45a049;
    }

    #filter-sort {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin: 20px 0;
    }


    @media (max-width: 1500px) {
        #container {
            flex-direction: column;
            align-items: center;
        }

        .subcontainer {
            width: 90%;
        }
    }

    #filter-sort {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        margin: 20px 0;
        padding: 15px;
        border-radius: 8px;
    }

    #filter-sort select,
    #filter-sort button {
        padding: 8px 12px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background-color: white;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    #filter-sort select:focus,
    #filter-sort button:focus {
        outline: none;
        border-color: #4CAF50;
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.4);
    }

    #filter-sort button {
        background-color: #4CAF50;
        color: white;
        font-weight: bold;
        border: none;
    }

    #filter-sort button:hover {
        background-color: #45a049;
    }
</style>

<body>


    <h1 style="text-align: center;">Library Management System</h1>

    <div id="entryContainer">
        <div id="booksEntry">
            <form id="bookForm" action="" onsubmit="addOrEditBooks(event)">
                <input type="hidden" placeholder="id" id="id" /> <!-- Hidden input for book ID -->
                <input type="text" placeholder="Title" id="title" />
                <input type="text" placeholder="Author" id="author" />
                <input type="text" placeholder="Genre" id="genre" />
                <input type="number" placeholder="Publish Year" id="publishedYear" />
                <input type="text" placeholder="Available" id="available" />

                <button type="submit">Add Book</button>
            </form>
        </div>
        <div id="membersEntry">
            <form id="memberForm" action="" onsubmit="addMembers(event)">
                <input type="text" placeholder="Name" />
                <input type="text" placeholder="Membership Date" />
                <input type="text" placeholder="Active" />
                <button type="submit">Add Member</button>
            </form>
        </div>

    </div>

    <!-- table container -->
    <div id="container">
        <div class="subcontainer">
            <div id="filter-sort">

                <select id="filterGenre">
                    <option value="all-genre">All Genre</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Horror">Horror</option>
                </select>
                <select id="filterAuthor">
                    <option value="all-author">All Author</option>
                    <option value="Frank Herbert">Frank Herbert</option>
                    <option value="George Orwell">George Orwell</option>
                </select>
                <select id="availableFilter">
                    <option value="all">All Books</option>
                    <option value="true">Available</option>
                    <option value="false">Not Available</option>
                </select>
                <button onclick="displayFilteredAndSortedBooks()">Apply Filter</button>

                <select id="sortBy">
                    <option value="">-- Sort By --</option>
                    <option value="title-asc">Title (A-Z)</option>
                    <option value="title-desc">Title (Z-A)</option>
                    <option value="year-asc">Year (Oldest First)</option>
                    <option value="year-desc">Year (Newest First)</option>
                    <option value="author-asc">Author (A-Z)</option>
                    <option value="author-desc">Author (Z-A)</option>
                </select>

                <button onclick="displayFilteredAndSortedBooks()">Apply Sorting</button>
            </div>
            <h2 style="text-align: center;">Book details</h2>
            <table id="bookTable">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th style="width: 150px;">Author</th>
                        <th style="width: 100px;">Genere</th>
                        <th style="width: 100px;">Publish Year</th>
                        <th style="width: 100px;">Available</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- data will be inserted here -->
                </tbody>
            </table>
        </div>
        <div class="subcontainer">
            <div id="filter-sort">

                <select id="filterByStatus">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
                <select id="filterByMembershipDate">
                    <option value="asc"> (Oldest First)</option>
                    <option value="desc"> (Newest First)</option>
                </select>
                <button onclick="applyFilterAndSort()">Apply Filter</button>

                <select id="sortByMembershipDate">
                    <option value="membershipDate-asc">Membership Date (Oldest First)</option>
                    <option value="membershipDate-desc">Membership Date (Newest First)</option>
                </select>
                <select id="sortByName">
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                </select>
                <button onclick="applyFilterAndSort()">Apply Sorting</button>
            </div>
            <h2 style="text-align: center;">Member details</h2>
            <table id="memberTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th style="width: 150px;">Membership Date</th>
                        <th style="width: 150px;">Active</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <!-- data will be inserted here -->

                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
<script src="main.js">

</script>

</html>
