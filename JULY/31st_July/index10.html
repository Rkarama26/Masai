<!DOCTYPE html>
<html>
<head>
    <title>Users Pagination</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        #usersContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        #usersContainer div {
            background-color: #fff;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        #usersContainer div:hover {
            transform: translateY(-4px);
        }

        #pagination {
            margin-top: 30px;
            text-align: center;
        }

        #pagination button {
            margin: 0 5px;
            padding: 8px 16px;
            font-size: 14px;
            background-color: #eee;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #pagination button:hover {
            background-color: #dcdcdc;
        }

        #pagination button.active {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>User List</h2>

    <div id="usersContainer"></div>

    <!-- Pagination buttons -->
    <div id="pagination"></div>

    <script>
        const USERS_API = "https://jsonplaceholder.typicode.com/users";
        const USERS_PER_PAGE = 6;
        let allUsers = [];
        let currentPage = 1;

        // Fetch users
        async function fetchUsers() {
            try {
                const res = await fetch(USERS_API);
                const data = await res.json();
                allUsers = data;

                renderUsers(currentPage);
                createPaginationButtons();
            } catch (error) {
                console.error("Error fetching users:", error);
            }
        }

        // Display users for current page
        function renderUsers(page) {
            const container = document.getElementById("usersContainer");
            container.innerHTML = "";

            const start = (page - 1) * USERS_PER_PAGE;
            const end = start + USERS_PER_PAGE;
            const usersToShow = allUsers.slice(start, end);

            usersToShow.forEach(user => {
                const userCard = document.createElement("div");
                userCard.innerHTML = `
                    <strong>${user.name}</strong><br>
                    <small>Email:</small> ${user.email}<br>
                    <small>Phone:</small> ${user.phone}
                `;
                container.appendChild(userCard);
            });

            highlightActiveButton(page);
        }

        //  pagination buttons
        function createPaginationButtons() {
            const paginationDiv = document.getElementById("pagination");
            paginationDiv.innerHTML = "";

            const totalPages = Math.ceil(allUsers.length / USERS_PER_PAGE);

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement("button");
                btn.textContent = `Page ${i}`;

                btn.addEventListener("click", () => {
                    currentPage = i;
                    renderUsers(i);
                });

                btn.setAttribute("data-page", i);
                paginationDiv.appendChild(btn);
            }

            highlightActiveButton(currentPage);
        }

        // Highlight active button
        function highlightActiveButton(page) {
            const buttons = document.querySelectorAll("#pagination button");
            buttons.forEach(btn => {
                btn.classList.remove("active");
                if (parseInt(btn.getAttribute("data-page")) === page) {
                    btn.classList.add("active");
                }
            });
        }

        // Initial fetch
        fetchUsers();
    </script>
</body>
</html>
