<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>

        /*
         Requirements:
Fetch data from the API using the Fetch API and display the products in console dynamically.
Implement error handling to display a message like "Failed to fetch products. Please try again later" when the API call fails.
Use a try-catch block to handle errors with async/await.
Finally implement reduce method to calculate the sum of all the products price . But make sure that you're using reduce method to do so , if not then
        */

      console.log("hello")

      
      async function fetchProducts() {
        try {

            const response = await fetch('https://fakestoreapi.com/products')
            if(!response.ok) {
                throw new Error("Response not ok")
            }

            const products = await response.json();

            products.forEach(product => {
                console.log(`product: ${product.title} | price: ${product.price}`)
            });
            
            const totalPrice = products.reduce((sum, prodcut) => {
                return sum + prodcut.price;
            }, 0)

            console.log("totalPrice: ", Math.ceil(totalPrice))


        } catch (error) {
            console.log("Filed to fetch products.")
        }
      }


      fetchProducts()
    </script>
</body>
</html>
