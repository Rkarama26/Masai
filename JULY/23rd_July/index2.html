    <!-- event delegation 2  - adding task by delegation-->

    <div id="task-container">
        <input type="text" id="inputTask">
        <button id="btn">Add Task</button>
    </div>
    <div>
        <button onclick="handleHighPriority()">High Priority</button>
        <button onclick="handleLowPriority()">Low Priority</button>
        <span id="totalTask"></span>
    </div>

        <li>task1</li>

<script>

    const tasks = [];

    const btn = document.querySelector('#btn');
    const inputField = document.querySelector("#inputTask")


    function addTask() {
        const inputText = inputField.value.trim();

        if (inputText !== "") {
            const task = { text: inputText, done: false, highPriority: false };
            tasks.push(task);
            renderTaskList(tasks);
            inputField.value = ""; // Clears the input field
        }
    }

    btn.addEventListener('click', addTask);

    inputField.addEventListener('keydown', (event) => {
        if (event.key === "Enter") {
            addTask();
        }
    })





    const taskList = document.querySelector("#taskList");
    const totalTask = document.getElementById("totalTask");

    function renderTaskList(tasks) {
        taskList.innerHTML = "";

        const total = tasks.reduce((acc) => acc + 1, 0);
        console.log("total Tasks: ", total)
        totalTask.textContent = `Total Tasks ${total}`

        tasks.forEach(task => {
            const li = document.createElement('li');

            const textSpan = document.createElement("span");
            textSpan.textContent = task.text
            li.appendChild(textSpan);

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            li.appendChild(checkbox)




            taskList.appendChild(li);
        })

    }

    //task delegation
    taskList.addEventListener('click', (event) => {


        //IF LI DIRECTLY CONTAINS THE TEXT
        // if (event.target.tagName === "LI") {
        //     console.log(event.target.tagName)
        //     event.target.remove();
        // }

        // IF LI CONTAINS SOME NESTED ELEMENT THAN TEXT

        if (event.target.tagName === "SPAN") {
            const li = event.target.closest("li")
            if (li && taskList.contains(li)) {

                const index = Array.from(taskList.children).indexOf(li);
                if(index !== -1) tasks.splice(index, 1);
                li.remove();
               renderTaskList(tasks)
            }
        }

    })


    function handleHighPriority() {
        const highPriority = tasks.filter(task => task.highPriority);
        renderTaskList(highPriority)
    }
    function handleLowPriority() {
        const lowPriority = tasks.filter(task => !task.highPriority);
        renderTaskList(lowPriority)
    }


</script>
