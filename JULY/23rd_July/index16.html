<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div#container {

        display: grid;
        gap: 20px;
        grid-template-columns: repeat(3, 1fr);


    }

    .grid-item {
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        text-align: center;
    }

    
</style>

<body>
    <div id="container">
       
    </div>
</body>
<script>

    const products = [
        { id: 1, name: "Product A", price: 50, inStock: true },
        { id: 2, name: "Product B", price: 30, inStock: false },
        { id: 3, name: "Product C", price: 70, inStock: true },
        { id: 4, name: "Product D", price: 20, inStock: false },
        { id: 5, name: "Product E", price: 70, inStock: true },
        { id: 6, name: "Product F", price: 20, inStock: false }
    ];

    const container = document.getElementById('container');

    products.forEach(item => {
        const div = document.createElement('div');
        div.className = "grid-item";
        div.style.backgroundColor = item.inStock ? "lightgreen" : "lightcoral";


        const h3 = document.createElement('h3');
        h3.textContent = item.name;

        const p = document.createElement('p');
        p.textContent = `Price: ₹ ${item.price}`;

       

        div.appendChild(h3)
        div.appendChild(p)


        container.appendChild(div)
    });


</script>

</html>
