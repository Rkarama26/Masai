<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Personal Page</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        section {
            margin-bottom: 20px;
        }

        form input {
            display: block;
            margin: 8px 0;
            padding: 6px;
            width: 250px;
        }

        form button {
            padding: 6px 12px;
        }
    </style>
</head>
<body>

    <h1>Hello, I'm Rohit!</h1>

    <section>
        <h2>About Me</h2>
        <p>I'm a curious learner with an interest in web development and programming. I love exploring how technology works.</p>
    </section>

    <section>
        <h2>Hobbies</h2>
        <p>I enjoy coding, nature photography, and spending time in nature.</p>
    </section>

    <section>
        <h2>Contact Information</h2>
        <a href="https://www.linkedin.com/feed/">LinkedIn</a>
        <p>Feel free to reach out through this form:</p>
        <form>
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <button type="submit">Submit</button>
        </form>
    </section>

</body>
</html>
